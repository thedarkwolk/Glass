<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liquid Glass</title>
  <link rel="stylesheet" href="liquid-glass.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #0b0b12;
      color: #fff;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Fondo vivo para que se note la refracción */
    .scene {
      position: fixed; inset: 0;
      background:
        radial-gradient(40% 50% at 15% 20%, #ff5e8a 0%, transparent 60%),
        radial-gradient(35% 45% at 85% 25%, #5b8cff 0%, transparent 60%),
        radial-gradient(45% 55% at 70% 85%, #ffb347 0%, transparent 60%),
        radial-gradient(40% 50% at 20% 85%, #3ce0b0 0%, transparent 60%),
        #14121f;
    }
    .scene::before {          /* rejilla de líneas: muestra muy bien la curvatura */
      content: ""; position: absolute; inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.14) 0 1px, transparent 1px 44px),
        repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 1px, transparent 1px 44px);
    }
    .scene .words {
      position: absolute; inset: -10% -5%;
      display: flex; flex-wrap: wrap; align-content: center; gap: 0 28px;
      font-size: clamp(48px, 9vw, 120px); font-weight: 800; letter-spacing: -0.04em;
      line-height: 1; color: rgba(255,255,255,.88);
      transform: rotate(-8deg);
      animation: drift 40s linear infinite alternate;
      user-select: none;
    }
    .scene .words span:nth-child(3n) { color: #111; }
    .scene .words span:nth-child(4n) { color: transparent; -webkit-text-stroke: 2px #fff; }
    @keyframes drift { to { transform: rotate(-8deg) translateX(-12%); } }
    @media (prefers-reduced-motion: reduce) { .scene .words { animation: none; } }

    /* ---------- El recuadro de cristal ---------- */
    .card {
      position: absolute;
      left: 50%; top: 42%;
      width: min(360px, calc(100vw - 32px));
      padding: 28px 26px 24px;
      transform: translate(-50%, -50%);
      --glass-tint: rgba(20, 18, 32, 0.12);
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .card:active { cursor: grabbing; }
    .card .row { display: flex; align-items: center; gap: 14px; }
    .card .icon {
      width: 52px; height: 52px; border-radius: 14px; flex: none;
      display: grid; place-items: center;
      background: rgba(255,255,255,.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
    }
    .card h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
    .card p  { margin: 2px 0 0; font-size: 14px; opacity: .78; }
    .card { text-shadow: 0 1px 8px rgba(0,0,0,.25); }
    .card .big { font-size: 64px; font-weight: 300; letter-spacing: -0.04em; margin: 18px 0 4px; line-height: 1; }
    .card .hint { font-size: 12px; opacity: .6; margin-top: 14px; }

    /* Píldora inferior, como la barra de pestañas de iOS 26 */
    .pill {
      --glass-radius: 999px;
      position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
      display: flex; gap: 4px; padding: 6px;
    }
    .pill button {
      appearance: none; border: 0; background: transparent; color: #fff;
      font: inherit; font-size: 13px; font-weight: 600;
      padding: 10px 18px; border-radius: 999px; cursor: pointer;
    }
    .pill button[aria-pressed="true"] { background: rgba(255,255,255,.22); }

    /* Panel de ajustes */
    .controls {
      --glass-radius: 22px;
      position: absolute; top: 16px; right: 16px;
      --glass-tint: rgba(20, 18, 32, 0.35);
      width: 240px; padding: 16px 18px; font-size: 12px;
    }
    .controls label { display: block; margin-bottom: 10px; }
    .controls label span { display: flex; justify-content: space-between; opacity: .85; margin-bottom: 4px; }
    .controls input[type=range] { width: 100%; accent-color: #fff; }
    .controls .note { opacity: .6; margin: 4px 0 0; line-height: 1.4; }
    @media (max-width: 640px) {
      .controls { left: 16px; right: 16px; width: auto; }
      .card { top: 58%; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="words">
      <span>Liquid</span><span>Glass</span><span>iPhone</span><span>Cristal</span><span>Luz</span>
      <span>Refracción</span><span>Brillo</span><span>Liquid</span><span>Glass</span><span>iOS</span>
      <span>Cristal</span><span>Luz</span><span>Refracción</span><span>Brillo</span><span>Liquid</span>
      <span>Glass</span><span>iPhone</span><span>Cristal</span><span>Luz</span><span>Refracción</span>
    </div>
  </div>

  <!-- El recuadro: basta con la clase "glass" -->
  <div class="glass card" id="card">
    <div class="row">
      <div class="icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </div>
      <div>
        <h1>Madrid</h1>
        <p>Soleado · Máx. 24° Mín. 13°</p>
      </div>
    </div>
    <div class="big">21°</div>
    <p>Cielo despejado durante el resto del día.</p>
    <div class="hint">Arrástrame para ver la refracción</div>
  </div>

  <nav class="glass pill" aria-label="Pestañas">
    <button aria-pressed="true">Inicio</button>
    <button aria-pressed="false">Buscar</button>
    <button aria-pressed="false">Perfil</button>
  </nav>

  <form class="glass controls" id="controls">
    <label><span>Refracción <b id="v-refraction"></b></span><input type="range" name="refraction" min="0" max="160" value="70"></label>
    <label><span>Bisel <b id="v-bezel"></b></span><input type="range" name="bezel" min="4" max="80" value="28"></label>
    <label><span>Aberración <b id="v-aberration"></b></span><input type="range" name="aberration" min="0" max="20" value="6"></label>
    <label><span>Desenfoque <b id="v-blur"></b></span><input type="range" name="blur" min="0" max="8" step="0.1" value="2.5"></label>
    <label><span>Radio <b id="v-radius"></b></span><input type="range" name="radius" min="0" max="80" value="32"></label>
    <p class="note" id="note"></p>
  </form>

  <script src="liquid-glass.js"></script>
  <script>
    const card = document.getElementById("card");
    const cardGlass = new LiquidGlass(card);
    new LiquidGlass(document.querySelector(".pill"), { refraction: 40, bezel: 16, blur: 1.5 });
    new LiquidGlass(document.getElementById("controls"), { refraction: 30, bezel: 14, blur: 8 });

    document.getElementById("note").textContent = LiquidGlass.supported
      ? "Refracción SVG activa (Chromium)."
      : "Tu navegador no soporta backdrop-filter con SVG: se muestra el desenfoque de respaldo.";

    // Controles
    const form = document.getElementById("controls");
    const sync = () => {
      const v = Object.fromEntries(new FormData(form));
      for (const k in v) document.getElementById("v-" + k).textContent = v[k];
      card.style.setProperty("--glass-radius", v.radius + "px");
      cardGlass.set({ refraction: +v.refraction, bezel: +v.bezel, aberration: +v.aberration, blur: +v.blur });
      cardGlass.update();
    };
    form.addEventListener("input", sync);
    sync();

    // Pestañas
    document.querySelectorAll(".pill button").forEach(b => b.addEventListener("click", () => {
      document.querySelectorAll(".pill button").forEach(x => x.setAttribute("aria-pressed", x === b));
    }));

    // Arrastrar el recuadro
    let start = null;
    card.addEventListener("pointerdown", e => {
      const r = card.getBoundingClientRect();
      start = { x: e.clientX - r.left, y: e.clientY - r.top };
      card.setPointerCapture(e.pointerId);
    });
    card.addEventListener("pointermove", e => {
      if (!start) return;
      card.style.transform = "none";
      card.style.left = e.clientX - start.x + "px";
      card.style.top = e.clientY - start.y + "px";
    });
    card.addEventListener("pointerup", () => (start = null));
    card.addEventListener("pointercancel", () => (start = null));
  </script>
</body>
</html>
