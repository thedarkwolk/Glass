<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liquid Glass</title>
  <link rel="stylesheet" href="liquid-glass.css">
  <link rel="stylesheet" href="seasons.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: #fff;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Fondo vivo para que se note la refracción (colores según la estación) */
    .scene {
      position: fixed; inset: 0;
      background:
        radial-gradient(40% 50% at 15% 20%, var(--c1) 0%, transparent 60%),
        radial-gradient(35% 45% at 85% 25%, var(--c2) 0%, transparent 60%),
        radial-gradient(45% 55% at 70% 85%, var(--c3) 0%, transparent 60%),
        radial-gradient(40% 50% at 20% 85%, var(--c4) 0%, transparent 60%),
        var(--bg);
    }
    .scene::before {          /* rejilla de líneas: muestra muy bien la curvatura */
      content: ""; position: absolute; inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.14) 0 1px, transparent 1px 44px),
        repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 1px, transparent 1px 44px);
    }
    .scene .words {
      position: absolute; inset: -10% -5%;
      display: flex; flex-wrap: wrap; align-content: center; gap: 0 28px;
      font-size: clamp(48px, 9vw, 120px); font-weight: 800; letter-spacing: -0.04em;
      line-height: 1; color: rgba(255,255,255,.6);
      transform: rotate(-8deg);
      animation: drift 40s linear infinite alternate;
      user-select: none;
    }
    .scene .words span:nth-child(3n) { color: rgba(0,0,0,.45); }
    .scene .words span:nth-child(4n) { color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.6); }
    @keyframes drift { to { transform: rotate(-8deg) translateX(-12%); } }
    @media (prefers-reduced-motion: reduce) { .scene .words { animation: none; } }

    /* ---------- El recuadro de cristal ---------- */
    .card {
      position: absolute;
      left: 50%; top: 42%;
      width: min(360px, calc(100vw - 32px));
      padding: 28px 26px 24px;
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
      user-select: none;
      text-shadow: 0 1px 8px rgba(0,0,0,.25);
    }
    .card:active { cursor: grabbing; }
    .card .row { display: flex; align-items: center; gap: 14px; }
    .card .icon {
      width: 52px; height: 52px; border-radius: 14px; flex: none;
      display: grid; place-items: center;
      background: rgba(255,255,255,.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
    }
    .card .icon svg { width: 28px; height: 28px; }
    .card h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
    .card p  { margin: 2px 0 0; font-size: 14px; opacity: .8; }
    .card .big { font-size: 64px; font-weight: 300; letter-spacing: -0.04em; margin: 18px 0 4px; line-height: 1; font-variant-numeric: tabular-nums; }
    .card .hint { font-size: 12px; opacity: .6; margin-top: 14px; }

    /* Píldora inferior, como la barra de pestañas de iOS 26 */
    .pill {
      --glass-radius: 999px;
      position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
      display: flex; gap: 2px; padding: 6px;
    }
    .pill button {
      appearance: none; border: 0; background: transparent; color: #fff;
      font: inherit; font-size: 13px; font-weight: 600;
      padding: 10px 16px; border-radius: 999px; cursor: pointer;
      transition: background-color .3s ease;
    }
    .pill button:hover { background: rgba(255,255,255,.1); }
    .pill button[aria-pressed="true"] { background: rgba(255,255,255,.24); }
    .pill button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    /* Panel de ajustes */
    .controls {
      --glass-radius: 22px;
      --glass-tint: rgba(20, 18, 32, 0.35);
      position: absolute; top: 16px; right: 16px;
      width: 240px; padding: 16px 18px; font-size: 12px;
    }
    .controls label { display: block; margin-bottom: 10px; }
    .controls label span { display: flex; justify-content: space-between; opacity: .85; margin-bottom: 4px; }
    .controls input[type=range] { width: 100%; accent-color: #fff; }
    .controls .note { opacity: .6; margin: 4px 0 0; line-height: 1.4; }
    @media (max-width: 640px) {
      .controls { left: 16px; right: 16px; width: auto; }
      .card { top: 58%; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="words">
      <span>Liquid</span><span>Glass</span><span>iPhone</span><span>Cristal</span><span>Luz</span>
      <span>Refracción</span><span>Brillo</span><span>Liquid</span><span>Glass</span><span>iOS</span>
      <span>Cristal</span><span>Luz</span><span>Refracción</span><span>Brillo</span><span>Liquid</span>
      <span>Glass</span><span>iPhone</span><span>Cristal</span><span>Luz</span><span>Refracción</span>
    </div>
    <!-- Partículas detrás del cristal: se ven refractadas a través de él -->
    <canvas class="fx fx-back"></canvas>
  </div>

  <!-- El recuadro: basta con la clase "glass" -->
  <div class="glass card" id="card">
    <div class="decor" aria-hidden="true">
      <div class="drops" id="drops"></div>
      <div class="flare"></div>
      <div class="frost"></div>
    </div>
    <div class="snowcap" aria-hidden="true">
      <svg viewBox="0 0 300 16" preserveAspectRatio="none">
        <defs><linearGradient id="snowShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dce9ff"/></linearGradient></defs>
        <path fill="url(#snowShade)" d="M0 16 C6 9 14 8 22 9 C30 4 44 3 54 7 C64 2 80 1 92 6 C104 3 116 4 126 8 C138 2 156 1 168 6 C180 3 196 3 206 8 C218 4 232 3 244 7 C256 4 270 5 280 9 C288 8 295 10 300 16 Z"/>
      </svg>
    </div>
    <svg class="resting-leaf" viewBox="-12 -14 24 30" aria-hidden="true">
      <path fill="#e8772e" d="M0 -12 Q9 -2 0 10 Q-9 -2 0 -12Z"/>
      <path stroke="rgba(70,25,0,.55)" stroke-width="1" fill="none" d="M0 -10 V14 M0 -3 L4 -6 M0 1 L-4 -2 M0 5 L4 2"/>
    </svg>

    <div class="row">
      <div class="icon" id="w-icon"></div>
      <div>
        <h1>Madrid</h1>
        <p id="w-summary"></p>
      </div>
    </div>
    <div class="big" id="w-temp" aria-live="polite"></div>
    <p id="w-desc"></p>
    <div class="hint">Arrástrame para ver la refracción</div>
  </div>

  <nav class="glass pill" aria-label="Estaciones">
    <button data-season="spring" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2.5"/><path d="M12 9.5C10 6 12 3 12 3s2 3 0 6.5M14.4 11.2c3-2.6 6.4-1.6 6.4-1.6s-1.2 3.3-5.2 3.2M13.5 14.2c1.6 3.6-.4 6.4-.4 6.4s-2.8-2-1.8-5.9M10.5 14.2c-1.6 3.6.4 6.4.4 6.4M9.6 11.2c-3-2.6-6.4-1.6-6.4-1.6s1.2 3.3 5.2 3.2"/></svg>Primavera</button>
    <button data-season="summer" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Verano</button>
    <button data-season="autumn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c5 4 6 9 0 15C6 12 7 7 12 3Z"/><path d="M12 7v15"/></svg>Otoño</button>
    <button data-season="winter" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17l17.4-10M9 4l3 2 3-2M9 20l3-2 3 2M4 10.5l2.6-1.5L6.5 6M17.5 18l-.1-3 2.6-1.5M4 13.5L6.6 15l-.1 3M17.5 6l-.1 3 2.6 1.5"/></svg>Invierno</button>
  </nav>

  <form class="glass controls" id="controls">
    <label><span>Refracción <b id="v-refraction"></b></span><input type="range" name="refraction" min="0" max="160" value="70"></label>
    <label><span>Bisel <b id="v-bezel"></b></span><input type="range" name="bezel" min="4" max="80" value="28"></label>
    <label><span>Aberración <b id="v-aberration"></b></span><input type="range" name="aberration" min="0" max="20" value="6"></label>
    <label><span>Desenfoque <b id="v-blur"></b></span><input type="range" name="blur" min="0" max="8" step="0.1" value="2.5"></label>
    <label><span>Radio <b id="v-radius"></b></span><input type="range" name="radius" min="0" max="80" value="32"></label>
    <p class="note" id="note"></p>
  </form>

  <!-- Partículas delante del cristal: pocas, grandes y desenfocadas -->
  <canvas class="fx fx-front" aria-hidden="true"></canvas>

  <script src="liquid-glass.js"></script>
  <script src="seasons.js"></script>
  <script>
    const card = document.getElementById("card");
    const cardGlass = new LiquidGlass(card);
    new LiquidGlass(document.querySelector(".pill"), { refraction: 40, bezel: 16, blur: 1.5 });
    new LiquidGlass(document.getElementById("controls"), { refraction: 30, bezel: 14, blur: 8 });

    document.getElementById("note").textContent = LiquidGlass.supported
      ? "Refracción SVG activa (Chromium)."
      : "Tu navegador no soporta backdrop-filter con SVG: se muestra el desenfoque de respaldo.";

    // ---------- Controles ----------
    const form = document.getElementById("controls");
    const sync = () => {
      const v = Object.fromEntries(new FormData(form));
      for (const k in v) document.getElementById("v-" + k).textContent = v[k];
      card.style.setProperty("--glass-radius", v.radius + "px");
      cardGlass.set({ refraction: +v.refraction, bezel: +v.bezel, aberration: +v.aberration, blur: +v.blur });
      cardGlass.update();
    };
    form.addEventListener("input", sync);

    // ---------- Estaciones ----------
    const icon = d => `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    const SEASONS = {
      spring: {
        temp: 18, summary: "Lluvia ligera · Máx. 20° Mín. 11°",
        desc: "Chubascos dispersos y cerezos en flor.",
        icon: icon('<path d="M7 15a4 4 0 0 1 .5-8A5.5 5.5 0 0 1 18 8.5 3.5 3.5 0 0 1 17.5 15Z"/><path d="M9 18l-1 2.5M13 18l-1 2.5M17 18l-1 2.5"/>'),
        glass: { refraction: 70, blur: 2.5, saturation: 1.6 },
      },
      summer: {
        temp: 34, summary: "Soleado · Máx. 37° Mín. 22°",
        desc: "Índice UV muy alto. Busca la sombra.",
        icon: icon('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
        glass: { refraction: 90, blur: 1.5, saturation: 1.9 },
      },
      autumn: {
        temp: 15, summary: "Ventoso · Máx. 17° Mín. 8°",
        desc: "Rachas de viento de hasta 40 km/h.",
        icon: icon('<path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/>'),
        glass: { refraction: 70, blur: 2.5, saturation: 1.5 },
      },
      winter: {
        temp: 2, summary: "Nieve · Máx. 4° Mín. −3°",
        desc: "Nevadas débiles durante la tarde.",
        icon: icon('<path d="M12 2v20M3.3 7l17.4 10M3.3 17l17.4-10M9 4l3 2 3-2M9 20l3-2 3 2M4 10.5l2.6-1.5L6.5 6M17.5 18l-.1-3 2.6-1.5M4 13.5L6.6 15l-.1 3M17.5 6l-.1 3 2.6 1.5"/>'),
        glass: { refraction: 60, blur: 6, saturation: 1.3 },   // cristal esmerilado por el frío
      },
    };

    const fx = new SeasonFX(document.querySelector(".fx-back"), document.querySelector(".fx-front"));
    const tempEl = document.getElementById("w-temp");
    let shownTemp = null, tempAnim = 0;

    function animateTemp(to) {
      cancelAnimationFrame(tempAnim);
      const from = shownTemp ?? to, t0 = performance.now(), dur = 900;
      const frame = now => {
        const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        shownTemp = Math.round(from + (to - from) * e);
        tempEl.textContent = shownTemp + "°";
        if (k < 1) tempAnim = requestAnimationFrame(frame);
      };
      tempAnim = requestAnimationFrame(frame);
    }

    function setSeason(name) {
      const s = SEASONS[name];
      document.body.dataset.season = name;
      document.querySelectorAll(".pill button").forEach(b =>
        b.setAttribute("aria-pressed", b.dataset.season === name));
      document.getElementById("w-icon").innerHTML = s.icon;
      document.getElementById("w-summary").textContent = s.summary;
      document.getElementById("w-desc").textContent = s.desc;
      animateTemp(s.temp);
      form.refraction.value = s.glass.refraction;
      form.blur.value = s.glass.blur;
      cardGlass.set({ saturation: s.glass.saturation });
      sync();
      fx.set(name);
      try { localStorage.setItem("glass-season", name); } catch (e) {}
    }

    document.querySelectorAll(".pill button").forEach(b =>
      b.addEventListener("click", () => setSeason(b.dataset.season)));

    // Gotas de lluvia sobre el cristal (primavera)
    const drops = document.getElementById("drops");
    for (let i = 0; i < 22; i++) {
      const d = document.createElement("span");
      const size = 3 + Math.random() ** 2 * 9;
      d.className = "drop" + (size > 8 && Math.random() < 0.6 ? " trail" : "");
      Object.assign(d.style, {
        width: size + "px", height: size * 1.08 + "px",
        left: Math.random() * 96 + "%", top: Math.random() * 94 + "%",
      });
      d.style.setProperty("--trail", 12 + Math.random() * 40 + "px");
      drops.appendChild(d);
    }

    let initial = null;
    try { initial = localStorage.getItem("glass-season"); } catch (e) {}
    const fromUrl = new URLSearchParams(location.search).get("season");
    setSeason(SEASONS[fromUrl] ? fromUrl : SEASONS[initial] ? initial : SeasonFX.fromDate());

    // ---------- Arrastrar el recuadro ----------
    let start = null;
    card.addEventListener("pointerdown", e => {
      const r = card.getBoundingClientRect();
      start = { x: e.clientX - r.left, y: e.clientY - r.top };
      card.setPointerCapture(e.pointerId);
    });
    card.addEventListener("pointermove", e => {
      if (!start) return;
      card.style.transform = "none";
      card.style.left = e.clientX - start.x + "px";
      card.style.top = e.clientY - start.y + "px";
    });
    card.addEventListener("pointerup", () => (start = null));
    card.addEventListener("pointercancel", () => (start = null));
  </script>
</body>
</html>
